name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # Venía en la plantilla de Nuxt y vale la pena conservarlo: atrapa
      # errores que ESLint no ve. Ya encontró uno real — acceder a
      # `arqueo.diferencia` sin comprobar que el turno esté cerrado.
      - name: Typecheck
        run: npm run typecheck

      # Aritmética del carrito y cliente de API. Corren en Node, sin DOM
      # ni runtime de Nuxt: la suite entera tarda menos de medio segundo,
      # que es lo que hace que se siga corriendo.
      - name: Pruebas
        run: npm run test

      - name: Build
        run: npm run build
